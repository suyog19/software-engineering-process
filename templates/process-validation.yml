name: Engineering process
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Bootstrap replaces PROCESS_REVISION with the immutable process Git SHA.
      - run: pip install 'git+https://github.com/suyog19/software-engineering-process@PROCESS_REVISION'
      - run: engineering-process validate --runtime-revision 'PROCESS_REVISION'
