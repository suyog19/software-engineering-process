schema_version: 1
process:
  version: 1.4.1
  source: suyog19/software-engineering-process
controls:
  traceability:
    semantics: locked
    enabled: true
  issue_first:
    semantics: locked
    enabled: true
  independent_review:
    semantics: locked
    enabled: true
    fresh_context_required: true
    implementation_context_may_issue_verdict: false
  protected_fail_closed:
    semantics: locked
    enabled: true
  exact_revision_evidence:
    semantics: locked
    enabled: true
  committed_secrets_prohibited:
    semantics: locked
    enabled: true
  human_production_boundary:
    semantics: locked
    enabled: true
    human_authorization_required: true
    manual_promotion_required: true
    automation_may_authorize: false
    automation_may_promote: false
    owner_manual_authorization_may_satisfy: true
  agent_execution_security:
    semantics: locked
    enabled: true
    least_privilege: true
    sandbox_required_for: [Standard, Protected]
    protected_requires_enforced_isolation: true
    credential_isolation_required: true
    production_credentials_prohibited: true
    network_default: deny
    network_allowlist_required: true
    tool_default: deny
    tool_allowlist_required: true
    external_mutation_requires_explicit_authorization: true
    destructive_action_requires_explicit_authorization: true
    untrusted_content_is_data_not_instruction: true
    prompt_injection_resistance_required: true
    audit_log_required: true
  required_capabilities:
    semantics: extensible
    values: [software-developer, ci-automation]
  protected_characteristics:
    semantics: extensible
    values: [financial_consequence, payment, authentication, authorization, iam, secrets, sensitive_data, production_controls, irreversible_data]
  validation_commands:
    semantics: overridable
    values: []
  repository_paths:
    semantics: overridable
    values: []
capabilities:
  product-owner: {authority: product_intent_and_acceptance}
  orchestrator: {authority: classification_handoffs_and_evidence}
  senior-ux-designer: {authority: user_interaction_accessibility_perspective}
  architect: {authority: architecture_and_technical_boundaries}
  engineering-manager: {authority: delivery_risk_and_operational_realism}
  software-developer: {authority: implementation_within_resolved_obligations}
  functional-qa: {authority: independent_behavioural_assurance}
  non-functional-qa: {authority: security_reliability_performance_privacy_operations}
  independent-review: {authority: fresh_context_final_review}
  solution-sufficiency: {authority: minimum_sufficient_solution_and_feedback_triage}
  ci-automation: {authority: objective_checks_and_policy_enforcement}
native_enforcement:
  readiness_gate_required: true
  protected_branch_required: true
  production_environment:
    manual_human_promotion_required: true
    automation_may_promote: false
    distinct_human_reviewer_required: false
    stronger_multi_human_gate_permitted: true
